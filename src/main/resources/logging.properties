# =============================================================================
# Hello World MVC - java.util.logging configuration
# Authors: Aritz Navarro, Brayan Romero, Ekaitz Rivero
#
# Messages are written to the console and to rotating files in the "logs"
# folder of the working directory (created when the application starts).
# Passwords and password hashes are never logged.
# =============================================================================

handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default level of every logger
.level = INFO

# Loggers of the application: FINE also records the details of each data access
tartanga.dami2.din.helloworldmvc.level = FINE

# Console: information, warnings and errors
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Files: everything the loggers record, up to 5 files of 1 MB each
java.util.logging.FileHandler.level = FINE
java.util.logging.FileHandler.pattern = logs/hello-world-mvc-%g.log
java.util.logging.FileHandler.limit = 1048576
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.encoding = UTF-8
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# One line per message: date, time, level, logger name, message and exception
java.util.logging.SimpleFormatter.format = %1$tF %1$tT %4$-7s [%3$s] %5$s%6$s%n
