# =============================================================================
# Hello World MVC - users of the FILE data access implementation
# Authors: Aritz Navarro, Brayan Romero, Ekaitz Rivero
#
# Each user is described by five keys that start with their login (lowercase):
#   <login>.passwordHash  PBKDF2 hash of the password (see "Adding a user" in README.md)
#   <login>.firstName     first name
#   <login>.lastName      last name
#   <login>.email         email address
#   <login>.birthDate     date of birth, in the format yyyy-MM-dd
#
# The demo passwords are listed in README.md. The same users are created in the
# database by database/hello_world_mvc.sql.
# =============================================================================

